<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Inner Glow Border -->
  <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6" />

  <!-- Protective Shield -->
  <path d="M256 90 L380 145 C380 270 256 385 256 385 C256 385 132 270 132 145 Z" 
        fill="url(#shieldGrad)" 
        stroke="#ef4444" 
        stroke-width="6" 
        filter="drop-shadow(0 12px 24px rgba(220, 38, 38, 0.4))" />

  <!-- First Aid Medical Cross in White -->
  <path d="M232 170 H280 V220 H330 V268 H280 V318 H232 V268 H182 V220 H232 Z" 
        fill="#ffffff" 
        filter="drop-shadow(0 4px 8px rgba(0,0,0,0.3))" />

  <!-- Dynamic Pulse Lifeline (ECG / Bridge) across cross -->
  <path d="M150 244 L205 244 L225 210 L245 280 L268 220 L285 255 L305 244 L362 244" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="drop-shadow(0 2px 6px rgba(56, 189, 248, 0.8))" />
</svg>
